<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Helvetica, sans-serif;
        font-size: 12px;
        width: 80mm; /* Thermal Printer Width */
        margin: 0;
        padding: 5px;
      }
      .header {
        text-align: center;
        margin-bottom: 10px;
      }
      .title {
        font-size: 16px;
        font-weight: bold;
      }
      .meta {
        font-size: 10px;
        margin-bottom: 10px;
        border-bottom: 1px dashed black;
        padding-bottom: 5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 10px;
      }
      th {
        text-align: left;
        border-bottom: 1px solid black;
        font-size: 10px;
      }
      td {
        font-size: 10px;
        padding-top: 2px;
      }
      .qty {
        text-align: center;
      }
      .price {
        text-align: right;
      }

      .totals {
        margin-top: 10px;
        border-top: 1px dashed black;
        padding-top: 5px;
      }
      .total-row {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        font-size: 14px;
      }

      .footer {
        text-align: center;
        font-size: 9px;
        margin-top: 20px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">HYPERMARKET SYSTEM</div>
      <div>Sales Receipt</div>
    </div>

    <div class="meta">
      Order ID: #{{orderId}}<br />
      Date: {{date}}<br />
      Seller: {{sellerName}}
    </div>

    <table>
      <thead>
        <tr>
          <th width="55%">Item</th>
          <th width="15%" class="qty">Quantity</th>
          <th width="15%" class="price">Price</th>
          <th width="15%" class="price">Total</th>
        </tr>
      </thead>
      <tbody>
        <!-- ITEMS_GO_HERE -->
        {{itemsRows}}
      </tbody>
    </table>

    <div class="totals">
      <div style="text-align: right; font-size: 10px">
        Total Qty: {{totalQty}}
      </div>
      <div class="total-row">
        <span>GRAND TOTAL:</span>
        <span>${{totalPrice}}</span>
      </div>
    </div>

    <div class="footer">
      Thank you for shopping!<br />
      Returns within 30 days.
    </div>
  </body>
</html>
