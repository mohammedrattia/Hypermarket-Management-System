name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Grant Permission
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test

      - name: Build Project
        run: ./mvnw package
