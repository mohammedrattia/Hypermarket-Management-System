name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  # ==================================================
  # JOB 1: Build Windows Versions + Universal JAR
  # ==================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # --- BUILD STEPS ---
    - name: Build Windows Installer
      run: scripts\build_windows_installer.bat

    - name: Build Windows Portable
      run: scripts\build_windows_portable.bat

    - name: Build Universal JAR
      run: scripts\build_windows_jar.bat

    - name: Zip Windows Portable
      run: Compress-Archive -Path "releases\Hypermarket System App" -DestinationPath "releases\Hypermarket-Portable-Win.zip"

    # --- UPLOAD SEPARATE ARTIFACTS (3 Files) ---
    
    # 1. JAR
    - name: Upload Universal JAR
      uses: actions/upload-artifact@v4
      with:
        name: Universal-JAR
        path: releases/HypermarketSystemApp.jar

    # 2. EXE
    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: "releases/Hypermarket System App.exe"

    # 3. Windows Portable ZIP
    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Portable
        path: releases/Hypermarket-Portable-Win.zip

  # ==================================================
  # JOB 2: Build Linux Versions
  # ==================================================
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Install Build Tools
      run: sudo apt-get install -y fakeroot rpm

    - name: Grant Permission
      run: chmod +x scripts/*.sh mvnw

    # --- BUILD STEPS ---
    - name: Build Linux Debian
      run: ./scripts/build_linux_deb.sh

    - name: Build Linux RPM
      run: ./scripts/build_linux_rpm.sh

    - name: Build Linux Portable
      run: ./scripts/build_linux_portable.sh

    - name: Zip Linux Portable
      run: tar -czf releases/Hypermarket-Portable-Linux.tar.gz -C releases hypermarket-system-app

    # --- UPLOAD SEPARATE ARTIFACTS (3 Files) ---

    # 4. DEB
    - name: Upload Linux Debian
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Debian
        path: releases/*.deb

    # 5. RPM
    - name: Upload Linux RPM
      uses: actions/upload-artifact@v4
      with:
        name: Linux-RPM
        path: releases/*.rpm

    # 6. Linux Portable TAR
    - name: Upload Linux Portable
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Portable
        path: releases/*.tar.gz

  # ==================================================
  # JOB 3: Create Release (ONLY if it's a Tag)
  # ==================================================
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    # We download ALL artifacts to the 'dist' folder
    # 'merge-multiple: true' removes the folders and dumps all 6 files directly into 'dist'
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true 

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "Hypermarket System ${{ github.ref_name }}" 
        
        body: |
          ## 🚀 New Release
          This is the latest version of the Hypermarket Management System.
          
          ### ✅ Features
          - Windows Installer (.exe)
          - Linux Installer (.deb / .rpm)
          - Portable versions for both OS
          
          ### 📥 Installation
          Download the file matching your OS from the "Assets" section below.
        
        files: dist/*