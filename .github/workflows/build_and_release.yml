name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  # ==================================================
  # JOB 1: Build Windows Versions + Universal JAR
  # ==================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'         # FIX: Changed from 21 to 25 to match your project
        distribution: 'temurin'

    # FIX: Use backslashes (\) and remove ./ for Windows
    - name: Build Windows Installer
      run: scripts\build_windows_installer.bat

    - name: Build Windows Portable
      run: scripts\build_windows_portable.bat

    # We build the JAR here once. No need to do it again on Linux.
    # Assumes the file is named 'build_jar.bat' as we created earlier.
    - name: Build Universal JAR
      run: scripts\build_jar.bat

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Builds
        path: releases/
        
  # ==================================================
  # JOB 2: Build Linux Versions
  # ==================================================
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    # FIX: Install tools for BOTH .deb (fakeroot) and .rpm (rpm)
    - name: Install Build Tools
      run: sudo apt-get install -y fakeroot rpm

    - name: Grant Permission
      run: chmod +x scripts/*.sh mvnw

    - name: Build Linux Debian
      run: ./scripts/build_linux_deb.sh

    - name: Build Linux Portable
      run: ./scripts/build_linux_portable.sh

    # ✅ UNCOMMENTED and READY
    - name: Build Linux RPM
      run: ./scripts/build_linux_rpm.sh

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Builds
        path: releases/

  # ==================================================
  # JOB 3: Create Release (ONLY if it's a Tag)
  # ==================================================
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Download Windows Builds
      uses: actions/download-artifact@v4
      with:
        name: Windows-Builds
        path: dist/windows

    - name: Download Linux Builds
      uses: actions/download-artifact@v4
      with:
        name: Linux-Builds
        path: dist/linux

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/windows/*
          dist/linux/*
