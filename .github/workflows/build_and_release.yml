name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  # ==================================================
  # JOB 1: Build Windows Versions + Universal JAR
  # ==================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # 1. Build The Files
    - name: Build Windows Installer
      run: scripts\build_windows_installer.bat

    - name: Build Windows Portable
      run: scripts\build_windows_portable.bat

    - name: Build Universal JAR
      run: scripts\build_windows_jar.bat

    # 2. ZIP the Portable Folder (Crucial Step!)
    # We turn the folder "Hypermarket System App" into "Hypermarket-Portable-Win.zip"
    - name: Zip Windows Portable
      run: Compress-Archive -Path "releases\Hypermarket System App" -DestinationPath "releases\Hypermarket-Portable-Win.zip"

    # 3. Upload Results
    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Builds
        path: releases/
        
  # ==================================================
  # JOB 2: Build Linux Versions
  # ==================================================
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Install Build Tools
      run: sudo apt-get install -y fakeroot rpm

    - name: Grant Permission
      run: chmod +x scripts/*.sh mvnw

    # 1. Build The Files
    - name: Build Linux Debian
      run: ./scripts/build_linux_deb.sh

    - name: Build Linux RPM
      run: ./scripts/build_linux_rpm.sh

    - name: Build Linux Portable
      run: ./scripts/build_linux_portable.sh

    # 2. ZIP the Portable Folder
    # We turn the folder "hypermarket-system-app" into "Hypermarket-Portable-Linux.tar.gz"
    - name: Zip Linux Portable
      run: tar -czf releases/Hypermarket-Portable-Linux.tar.gz -C releases hypermarket-system-app

    # 3. Upload Results
    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Builds
        path: releases/

  # ==================================================
  # JOB 3: Create Release (ONLY if it's a Tag)
  # ==================================================
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Download Windows Builds
      uses: actions/download-artifact@v4
      with:
        name: Windows-Builds
        path: dist/windows

    - name: Download Linux Builds
      uses: actions/download-artifact@v4
      with:
        name: Linux-Builds
        path: dist/linux

    # This step takes all files and puts them on the Release Page
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/windows/*.exe
          dist/windows/*.jar
          dist/windows/*.zip
          dist/linux/*.deb
          dist/linux/*.rpm
          dist/linux/*.tar.gz