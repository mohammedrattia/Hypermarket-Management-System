name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  # ==================================================
  # JOB 1: Build Windows Versions + Universal JAR
  # ==================================================
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # --- BUILD STEPS ---
    - name: Build Windows Installer
      run: scripts\build_windows_installer.bat

    - name: Build Windows Portable
      run: scripts\build_windows_portable.bat

    - name: Build Universal JAR
      run: scripts\build_windows_jar.bat

    # --- RENAME & ZIP STEPS (The Magic Step) ---
    
    # 1. Rename EXE: "Hypermarket System App.exe" -> "Hypermarket System App Windows.exe"
    - name: Rename Windows Installer
      run: Move-Item -Path "releases\Hypermarket System App.exe" -Destination "releases\Hypermarket-System-App-Windows.exe"

    # 2. Rename JAR: "HypermarketSystemApp.jar" -> "Hypermarket System App Universal.jar"
    - name: Rename Universal JAR
      run: Move-Item -Path "releases\HypermarketSystemApp.jar" -Destination "releases\Hypermarket-System-App-Universal.jar"

    # 3. Zip Portable: Create "Hypermarket System Portable Windows.zip" directly
    - name: Zip Windows Portable
      run: Compress-Archive -Path "releases\Hypermarket System App" -DestinationPath "releases\Hypermarket-System-Portable-Windows.zip"

    # --- UPLOAD SEPARATE ARTIFACTS ---
    
    - name: Upload Universal JAR
      uses: actions/upload-artifact@v4
      with:
        name: Universal-JAR
        path: "releases/Hypermarket-System-App-Universal.jar"

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Installer
        path: "releases/Hypermarket-System-App-Windows.exe"

    - name: Upload Windows Portable
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Portable
        path: "releases/Hypermarket-System-Portable-Windows.zip"

  # ==================================================
  # JOB 2: Build Linux Versions
  # ==================================================
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Install Build Tools
      run: sudo apt-get install -y fakeroot rpm

    - name: Grant Permission
      run: chmod +x scripts/*.sh mvnw

    # --- BUILD STEPS ---
    - name: Build Linux Debian
      run: ./scripts/build_linux_deb.sh

    - name: Build Linux RPM
      run: ./scripts/build_linux_rpm.sh

    - name: Build Linux Portable
      run: ./scripts/build_linux_portable.sh

    # --- RENAME & ZIP STEPS (The Magic Step) ---

    # 1. Rename DEB (e.g. hypermarket_1.0.deb -> Hypermarket System App Linux.deb)
    - name: Rename Deb to Static
      run: mv releases/*.deb "releases/Hypermarket-System-App-Linux.deb"

    # 2. Rename RPM (e.g. hypermarket-1.0.rpm -> Hypermarket System App Linux.rpm)
    - name: Rename RPM to Static
      run: mv releases/*.rpm "releases/Hypermarket-System-App-Linux.rpm"

    # 3. Zip Portable: Create "Hypermarket System Portable Linux.tar.gz" directly
    - name: Zip Linux Portable
      run: tar -czf "releases/Hypermarket-System-Portable-Linux.tar.gz" -C releases hypermarket-system-app

    # --- UPLOAD SEPARATE ARTIFACTS ---

    - name: Upload Linux Debian
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Debian
        path: "releases/Hypermarket-System-App-Linux.deb"

    - name: Upload Linux RPM
      uses: actions/upload-artifact@v4
      with:
        name: Linux-RPM
        path: "releases/Hypermarket-System-App-Linux.rpm"

    - name: Upload Linux Portable
      uses: actions/upload-artifact@v4
      with:
        name: Linux-Portable
        path: "releases/Hypermarket-System-Portable-Linux.tar.gz"

  # ==================================================
  # JOB 3: Create Release
  # ==================================================
  release:
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true 

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: "Hypermarket System ${{ github.ref_name }}" 
        body: |
          ## 🚀 New Release
          This is the latest version of the Hypermarket Management System.
          ### 📥 Download
          See the assets section below or use the direct links in the README.
        files: dist/*