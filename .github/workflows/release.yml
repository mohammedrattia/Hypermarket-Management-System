name: Deploy Release

on:
    push:
        tags:
            - "v*"

jobs:
    # ==================================================
    # JOB 1: Run Tests
    # ==================================================
    test:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Grant Permission
              run: chmod +x mvnw

            - name: Run Unit Tests
              run: ./mvnw test

    # ==================================================
    # JOB 2: Build Windows Versions + Universal JAR
    # ==================================================
    build-windows:
        needs: test
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: "25"
                  distribution: "temurin"

            # --- Build Files ---
            - run: |
                  scripts\build_windows_jar.bat
                  Move-Item "releases\HypermarketSystemApp.jar" "releases\Hypermarket-System-Build-Universal.jar"
                  scripts\build_windows_installer.bat
                  Move-Item "releases\Hypermarket System App.exe" "releases\Hypermarket-System-App-Windows.exe"
                  scripts\build_windows_portable.bat
                  Compress-Archive "releases\Hypermarket System App" "releases\Hypermarket-System-Portable-Windows.zip"

            - uses: actions/upload-artifact@v4
              with:
                  name: Windows-Artifacts
                  path: releases/*

    # ==================================================
    # JOB 3: Build Linux Versions
    # ==================================================
    build-linux:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: "25"
                  distribution: "temurin"

            - name: Install Build Tools
              run: sudo apt-get install -y fakeroot rpm

            - name: Grant Permission
              run: chmod +x scripts/*.sh mvnw

            # --- Build Files ---
            - run: |
                  ./scripts/build_linux_deb.sh
                  mv releases/*.deb "releases/Hypermarket-System-App-Linux.deb"
                  ./scripts/build_linux_rpm.sh
                  mv releases/*.rpm "releases/Hypermarket-System-App-Linux.rpm"
                  ./scripts/build_linux_portable.sh
                  tar -czf "releases/Hypermarket-System-Portable-Linux.tar.gz" -C releases hypermarket-system-app

            - uses: actions/upload-artifact@v4
              with:
                  name: Linux-Artifacts
                  path: releases/*

    # ==================================================
    # JOB 4: Publish Release
    # ==================================================
    release:
        needs: [build-windows, build-linux]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download All Artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist
                  merge-multiple: true

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v1
              with:
                  name: "Hypermarket System ${{ github.ref_name }}"
                  body: |
                      ## 🚀 New Release
                      This is the latest version of the Hypermarket Management System.

                      ### ✅ Features
                      - Windows Installer (.exe)
                      - Linux Installer (.deb / .rpm)
                      - Portable versions for both OS

                      ### 📥 Installation
                      Download the file matching your OS from the "Assets" section below.

                  files: dist/*
