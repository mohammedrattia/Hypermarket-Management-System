name: Test & Build

on:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  # ==================================================
  # JOB 1: Run Tests
  # ==================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Grant Permission
        run: chmod +x mvnw

      - name: Run Unit Tests
        run: ./mvnw test

  # ==================================================
  # JOB 2: Build Windows Versions + Universal JAR
  # ==================================================
  build-windows:
    name: Build Windows
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      # --- Build Files ---

      # 1. JAR
      - name: Build Universal JAR
        run: |
          scripts\build_windows_jar.bat
          Move-Item -Path "releases\HypermarketSystemApp.jar" -Destination "releases\Hypermarket-System-Build-Universal.jar"

      # 2. EXE
      - name: Build Windows Installer
        run: |
          scripts\build_windows_installer.bat
          Move-Item -Path "releases\Hypermarket System App.exe" -Destination "releases\Hypermarket-System-App-Windows.exe"

      # 3. Windows Portable ZIP
      - name: Build Windows Portable
        run: |
          scripts\build_windows_portable.bat
          Compress-Archive -Path "releases\Hypermarket System App" -DestinationPath "releases\Hypermarket-System-Portable-Windows.zip"

      # --- Upload Separate Artifacts ---

      # 1. JAR
      - name: Upload Universal JAR
        uses: actions/upload-artifact@v4
        with:
          name: Universal-JAR
          path: "releases/Hypermarket-System-Build-Universal.jar"

      # 2. EXE
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: "releases/Hypermarket-System-App-Windows.exe"

      # 3. Windows Portable ZIP
      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Portable
          path: "releases/Hypermarket-System-Portable-Windows.zip"

  # ==================================================
  # JOB 3: Build Linux Versions
  # ==================================================
  build-linux:
    name: Build Linux
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Install Build Tools
        run: sudo apt-get install -y fakeroot rpm

      - name: Grant Permission
        run: chmod +x scripts/*.sh mvnw

      # --- Build Files ---

      # 4. DEB
      - name: Build Linux Debian
        run: |
          ./scripts/build_linux_deb.sh
          mv releases/*.deb "releases/Hypermarket-System-App-Linux.deb"

      # 5. RPM
      - name: Build Linux RPM
        run: |
          ./scripts/build_linux_rpm.sh
          mv releases/*.rpm "releases/Hypermarket-System-App-Linux.rpm"

      # 6. Linux Portable TAR
      - name: Build Linux Portable
        run: |
          ./scripts/build_linux_portable.sh
          tar -czf "releases/Hypermarket-System-Portable-Linux.tar.gz" -C releases hypermarket-system-app

      # --- UPLOAD SEPARATE ARTIFACTS ---

      # 4. DEB
      - name: Upload Linux Debian
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Debian
          path: "releases/Hypermarket-System-App-Linux.deb"

      # 5. RPM
      - name: Upload Linux RPM
        uses: actions/upload-artifact@v4
        with:
          name: Linux-RPM
          path: "releases/Hypermarket-System-App-Linux.rpm"

      # 6. Linux Portable TAR
      - name: Upload Linux Portable
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Portable
          path: "releases/Hypermarket-System-Portable-Linux.tar.gz"
